# Conda environment for both sides: Python (linter CLI, shared-fixture tests, lint/complexity checks)
# and Node.js for the TypeScript tools, so `make check` and the pre-push hook use the same versions.
# Create with: conda env create -f environment.yml
name: mech_training
channels:
  - conda-forge
dependencies:
  - python=3.12
  - rdkit
  - pytest
  - ruff
  - mypy
  - jsonschema
  - nodejs=24
