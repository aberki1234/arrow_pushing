# Lint, type and size checks for the Python side. The same limits as RetrosynthWeb (the user's standard);
# see "Code conventions" in ~/.claude/CLAUDE.md and the project CLAUDE.md.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["mockups", "docs", "node_modules", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "B", "I",
    "ANN",     # mandatory type annotations
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "C901",    # cyclomatic complexity
]
ignore = ["ANN401"]  # allow explicit typing.Any where genuinely needed

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["mockups", "docs", "node_modules", "dist", "build"]

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"  # the RDKit stubs contain syntax mypy rejects
follow_imports_for_stubs = true

[tool.size_limits]
# Enforced by tools/check_limits.py (ruff has no line-count rule).
max_function_lines = 50
max_file_lines = 500
# A dataclass's generated __init__ takes one argument per field, so this is ruff's max-args for them.
max_dataclass_fields = 6
# Folders and files to check; a missing one is skipped (python/ appears with the first package).
checked_paths = ["python", "tools", "tests"]
excluded_path_fragments = []

[tool.size_limits.dataclass_field_baseline]
# "path/to/file.py::ClassName" = fields it may keep. Existing offenders may shrink, never grow. Empty: there are none.

[tool.layers]
# Python packages under source_root, lowest layer first. A package may import only packages listed before it,
# never a top-level script of source_root. Checked by tools/check_layers.py. Add each new package here.
source_root = "python"
layers_lowest_first = ["reaction_files"]

[tool.pytest.ini_options]
pythonpath = ["tools", "python"]
testpaths = ["tests"]
# No __init__.py files in tests/, so same-named test files in different folders must not collide.
addopts = "--import-mode=importlib"
