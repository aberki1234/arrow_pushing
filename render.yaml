# The backend on Render (docs/SPEC.md §5, backend, "Server"): one Node web service that applies
# the migrations, then serves sign-in, the reaction API and the built editor.
# Variables marked sync: false are entered in Render's dashboard (src/backendServer/
# serverSettings.ts describes each); Render generates BETTER_AUTH_SECRET.
services:
  - type: web
    name: arrowpush-editor
    runtime: node
    plan: starter
    # Choose the region nearest the Supabase project when creating the service.
    # --include=dev: the build (Vite) and the start (tsx) use development packages.
    buildCommand: npm ci --include=dev && npx vite build --config vite.editor.config.ts
    startCommand: npx tsx src/backendServer/runFromShell.ts serve
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EDITOR_FILES_FOLDER
        value: build/editor
      # The learner site, for Create's "Back to the site" link; Vite reads it when the editor is
      # built, so a change needs a new build.
      - key: VITE_LEARNER_SITE_ADDRESS
        value: https://arrowpushing.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Ends in ?sslmode=verify-full&sslrootcert=deploy/supabase-root-ca.crt (Supabase's root CA).
      - key: DATABASE_URL
        sync: false
      # https://create.arrowpushing.com (Create's own address; GitHub's callback is under it).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # The owner's numeric GitHub user id; anyone else who signs in is a contributor.
      - key: ALLOWED_GITHUB_USER_IDS
        sync: false
      # Optional, together: the Google sign-in app (callback <PUBLIC_BASE_URL>/api/auth/callback/google).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEPLOY_REPOSITORY
        sync: false
      - key: DEPLOY_DISPATCH_TOKEN
        sync: false
