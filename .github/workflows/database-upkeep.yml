# The database's upkeep (docs/SPEC.md §5, backend, "Database"):
#   daily   a query, so that Supabase's free plan does not pause the project for inactivity
#   weekly  a pg_dump of the schema arrowpush, kept as a workflow artifact for 90 days
#
# Secret: DATABASE_READONLY_URL, a connection string for a read-only role. The tables have
# row-level security with no policies, so the role needs BYPASSRLS to read their rows (pg_dump
# refuses to dump a table whose rows it cannot all see). Session, account and verification rows
# are left out of the dump: they hold sign-in tokens, and signing in again recreates them.
name: Database upkeep

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          DATABASE_READONLY_URL: ${{ secrets.DATABASE_READONLY_URL }}
        run: psql "$DATABASE_READONLY_URL" --no-psqlrc --command "SELECT count(*) FROM arrowpush.reactions"

  weekly-dump:
    if: github.event.schedule == '47 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # pg_dump must be at least the server's version (Supabase runs Postgres 17).
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump the schema arrowpush
        env:
          DATABASE_READONLY_URL: ${{ secrets.DATABASE_READONLY_URL }}
        run: >
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_READONLY_URL"
          --schema=arrowpush --no-owner --no-privileges --format=custom
          --exclude-table-data=arrowpush.sessions
          --exclude-table-data=arrowpush.accounts
          --exclude-table-data=arrowpush.verifications
          --file=arrowpush-$(date -u +%Y-%m-%d).dump
      - uses: actions/upload-artifact@v4
        with:
          name: arrowpush-dump
          path: arrowpush-*.dump
          retention-days: 90
